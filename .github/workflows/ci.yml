name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: parcelpilot
          POSTGRES_PASSWORD: parcelpilot
          POSTGRES_DB: parcelpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parcelpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run golden test suite (source authority, edge cases, access control, actions)
        env:
          DATABASE_URL: postgresql+psycopg2://parcelpilot:parcelpilot@localhost:5432/parcelpilot_test
        run: |
          cd backend
          pytest -v
