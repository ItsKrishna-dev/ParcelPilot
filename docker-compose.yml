version: '3.9'
services:
  db:
    image: ankane/pgvector:latest
    container_name: parcelpilot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: parcelpilot
      POSTGRES_PASSWORD: parcelpilot
      POSTGRES_DB: parcelpilot
    ports:
      - "5432:5432"
    volumes:
      - parcelpilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parcelpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: parcelpilot_backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data_pack:/data_pack

volumes:
  parcelpilot_pgdata:
