<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>ParcelPilot AI Support Agent</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; }
  .container { max-width: 820px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; }
  select, input, button { font-size: 14px; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; }
  button { background: #2563eb; cursor: pointer; border: none; }
  button:hover { background: #1d4ed8; }
  #chat { border: 1px solid #334155; border-radius: 8px; height: 460px; overflow-y: auto; padding: 16px; margin: 16px 0; background: #111827; }
  .msg { margin-bottom: 14px; }
  .user { color: #93c5fd; }
  .assistant { color: #e2e8f0; }
  .trace { font-size: 12px; color: #94a3b8; background: #1e293b; border-radius: 6px; padding: 8px; margin-top: 6px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 6px; }
  .badge-ok { background: #14532d; color: #86efac; }
  .badge-escalate { background: #7f1d1d; color: #fca5a5; }
  .input-row { display: flex; gap: 8px; }
  .input-row input { flex: 1; }
</style>
</head>
<body>
<div class="container">
  <h1>ParcelPilot AI Support Agent</h1>
  <label>Session:
    <select id="session">
      <option value="cust-northstar">Customer -- Northstar Logistics (ACCT-001)</option>
      <option value="cust-lumenworks">Customer -- LumenWorks (ACCT-002)</option>
      <option value="cust-beacon">Customer -- Beacon Retail (ACCT-003)</option>
      <option value="agent-rohit">Internal -- Support Agent (Rohit)</option>
      <option value="manager-priya">Internal -- Manager (Priya)</option>
    </select>
  </label>

  <div id="chat"></div>

  <div class="input-row">
    <input id="message" placeholder="Ask about cancellations, credits, SLAs, tickets..." />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const API_BASE = "http://localhost:8000";
const chatEl = document.getElementById("chat");

function appendMessage(role, html) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = "<b>" + (role === "user" ? "You" : "ParcelPilot Agent") + ":</b> " + html;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function send() {
  const input = document.getElementById("message");
  const session = document.getElementById("session").value;
  const message = input.value.trim();
  if (!message) return;
  appendMessage("user", message);
  input.value = "";

  try {
    const resp = await fetch(`${API_BASE}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${session}` },
      body: JSON.stringify({ message }),
    });
    const data = await resp.json();

    const badge = data.escalated
      ? '<span class="badge badge-escalate">ESCALATE (confidence ' + data.confidence + ')</span>'
      : '<span class="badge badge-ok">confidence ' + data.confidence + '</span>';

    let traceHtml = "";
    (data.tool_trace || []).forEach(t => {
      traceHtml += `<div class="trace">\ud83d\udd27 <b>${t.tool_name}</b> (${t.latency_ms}ms) -> ${JSON.stringify(t.output).slice(0, 220)}...</div>`;
    });

    appendMessage("assistant", badge + "<br/>" + (data.answer || "").replace(/\n/g, "<br/>") + traceHtml);
  } catch (e) {
    appendMessage("assistant", "Error reaching backend: " + e);
  }
}

document.getElementById("message").addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>
</body>
</html>
